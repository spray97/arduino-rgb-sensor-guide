## 오늘 우리가 만드는 것

- 우리 팀 연구: 적양배추 색소(안토시아닌)로 물속 중금속을 색 변화로 감지하는 친환경 키트 개발
- 내 역할: 그 "색 변화"를 사람 눈이 아니라 **숫자(R, G, B 값)**로 정확하게 읽어내는 장치 제작
- 이번 장치는 **암실 상자(내부: 아두이노+센서) + 외부 조작판(LCD 화면+버튼)** 구조로, 상자를 열지 않고도 버튼 하나로 측정을 켜고 끄며 화면에서 바로 값을 확인할 수 있습니다.

## 완성 장치 미리보기 — 이게 뭘 하는 기계인가요?

- 완성된 장치는 **암실 상자(내부)**와 **외부 조작판**, 두 구역으로 나뉩니다.
  - **암실 상자 내부**: 아두이노 우노, 브레드보드, TCS34725 컬러센서 — 외부 빛이 차단된 채로 시료의 색을 스캔
  - **외부 조작판(상자 바깥면)**: I2C 16x2 LCD, 버튼(측정 On/Off) — 상자를 열지 않고도 조작·확인 가능
  - 두 구역은 **전선(4가닥 LCD용 + 2가닥 버튼용)만 작은 구멍 하나를 통해 연결**되며, 그 구멍은 배선 후 밀봉해 빛이 새지 않도록 처리
- 흐름: 시료 삽입 → 버튼으로 "측정 모드" 전환 → 센서가 색을 스캔 → 아두이노가 숫자로 변환 → **외부 LCD + 노트북 시리얼 모니터에 동시 출력** → 버튼으로 "대기 모드" 전환 후 시료 교체

![장치 구조도](images/device_overview.png)

> 💡 **시니어 과학샘 팁:** "왜 LCD를 상자 안에 넣지 않고 밖에 달았나요?" — 상자를 매번 열어 안을 들여다보면 그 순간 외부 빛이 들어가 측정 환경이 흐트러지기 때문입니다. 상자는 닫아둔 채로, 결과만 밖에서 확인하는 것이 정확한 측정의 핵심입니다.
        </script>
      </section>

## 시작 전 안전수칙

- **전자부품**: 전원을 켠 채로 배선을 바꾸지 않기 (항상 USB/배터리를 뽑은 상태에서 배선)
- **배터리**: 9V 배터리 스냅 커넥터는 모양이 정해져 있어 거꾸로 안 꽂힘 — 억지로 힘주지 않기
- **도구**: 커터칼·가위는 평평한 바닥에서, 손을 칼날 진행 방향에 두지 않기. 가능하면 보호자와 함께 작업
- **글루건**: 팁이 매우 뜨겁습니다(약 200℃). 사용 후 받침대에 세워두고 식을 때까지 만지지 않기
- **정전기**: 건조한 날엔 금속을 한 번 만져 정전기를 뺀 후 부품 만지기

> 💡 **시니어 과학샘 팁:** 아두이노 우노는 생각보다 튼튼해서 실수로 조금 잘못 연결해도 대부분 복구 가능합니다. 다만 "전원 뽑고 배선하기"와 "글루건 화상 주의" 두 가지는 꼭 지키세요.
        </script>

## Arduino IDE 다운로드

- 공식 사이트 `arduino.cc` 접속 → 상단 메뉴 **Software** → **Downloads**
- Windows 사용 중이므로 **"Windows Win 10 and newer, 64 bits"** 설치파일(.exe) 다운로드
- 기부하기 화면이 나오면 **JUST DOWNLOAD** 버튼을 눌러도 무료로 설치 가능

**체크 포인트**
- [ ] arduino.cc 공식 사이트에서 받았다
- [ ] 다운로드된 .exe 파일을 찾을 수 있다 (보통 "다운로드" 폴더)

> 💡 **시니어 과학샘 팁:** 항상 주소창에 `arduino.cc`가 맞는지 확인하는 습관을 들이세요.

## Arduino IDE 설치 과정

1. 다운로드한 .exe 파일 더블클릭 실행
2. "사용권 계약" 화면에서 **I Agree** 클릭
3. "설치 옵션" 화면에서 기본값 그대로(드라이버 설치 포함) **Next** 클릭
4. 설치 위치는 기본 경로 그대로, **Install** 클릭
5. Windows 보안 창(드라이버 설치 확인)이 뜨면 **설치** 클릭
6. 설치 완료 후 **Close**, 바탕화면 아이콘 확인

**체크 포인트**
- [ ] 바탕화면/시작메뉴에 Arduino 아이콘이 생겼다
- [ ] 아이콘을 더블클릭했을 때 프로그램이 정상적으로 열린다

> 💡 **시니어 과학샘 팁:** 설치 중 보안 경고창은 표준 절차입니다. 공식 사이트에서 받았다면 안전하게 허용해주세요.
        </script>
      </section>

## 보드 연결 + COM 포트 확인

1. 키트 포함 USB 케이블(A-B타입)로 아두이노 우노와 노트북 연결
2. 정상 연결되면 보드 위 전원 LED 켜짐
3. 시작 버튼 → "장치 관리자" → **포트(COM & LPT)** 펼치기 → `Arduino Uno (COM3)`처럼 COM 번호가 보이면 성공

**체크 포인트**
- [ ] 보드에 전원 LED가 켜졌다
- [ ] 장치 관리자에 COM 포트가 보인다
- [ ] (안 보이면) 케이블을 다른 USB 포트에 꽂거나 케이블을 교체해 재시도

> 💡 **시니어 과학샘 팁:** 저가형 USB 케이블 중 "충전 전용"(데이터선 없음) 케이블이 섞여 있습니다. COM 포트가 전혀 안 보이면 케이블부터 의심하세요.
        </script>

## IDE에서 보드·포트 선택하기

1. Arduino IDE → 상단 메뉴 **Tools(도구)**

      <section data-markdown>
        <script type="text/template">
## 왜 하필 3~10mm인가? — 측정 거리가 정확도를 좌우하는 이유

- TCS34725는 카메라처럼 렌즈로 상을 맺는 방식이 아니라, **내장 LED로 빛을 쏘고 반사되어 돌아오는 빛의 세기를 직접 측정**하는 방식입니다. 그래서 센서-시료 거리가 결과값에 직접 영향을 줍니다.

| 거리 | 무슨 일이 생기나 |
|---|---|
| 3mm 미만 (너무 가까움) | 반사광이 과도하게 강해져 값이 포화(saturation)됨 |
| **3~10mm (권장 범위)** | 반사광이 적당히 강해 안정적인 신호 확보 |
| 10mm 초과 (너무 멀음) | 반사광이 급격히 약해지고 외부 조명 비중이 커져 값이 들쭉날쭉 |

![센서-시료 거리에 따른 신호 품질 비교](images/sensor_distance_range.png)

- 추측이 아니라 **제조사(DFRobot) 공식 스펙**입니다 — Detection Range 3-10 mm, [wiki.dfrobot.com/sen0212](https://wiki.dfrobot.com/sen0212/)에서 직접 확인 가능

> ⚠️ **주의:** 이 거리가 매 측정마다 조금씩 달라지면 "중금속 농도에 의한 색 변화"인지 "측정 위치 오차"인지 구분할 수 없게 됩니다. 뒤에 나올 암실 상자 시료 삽입구 설계에서 이 거리를 반드시 고정값으로 만들어야 합니다.

> 💡 **시니어 과학샘 팁:** "가까울수록 무조건 좋다"가 아닙니다. 너무 가까워도 너무 멀어도 값이 나빠지는 구간이 있다는 걸 기억하고, 이 범위 안에서 항상 똑같은 거리를 유지하는 것이 핵심입니다.
        </script>
      </section>

## 부품/포트 총정리③ — I2C LCD 1602 커넥터

- 16개 가까운 핀이 필요한 부품이지만, 뒷면의 **I2C 백팩**(변환 기판) 덕분에 4개 핀으로 줄어듭니다.

| 핀 이름 | 역할 |
|---|---|
| GND | 전원 (−) |
| VCC | 전원 (+) |
| SDA | I2C 데이터선 (센서와 같은 A4) |
| SCL | I2C 시계선 (센서와 같은 A5) |

- **두 I2C 장치가 같은 선을 써도 되는 이유**: 각 장치가 고유 "I2C 주소"를 가져서 구분됩니다(TCS34725 보통 0x29, LCD 보통 0x27/0x3F — 슬라이드 26에서 직접 확인)
- LCD 백팩 위 작은 파란 나사(트림팟)가 있음 — 안 맞으면 글자가 안 보일 수 있음

> 💡 **시니어 과학샘 팁:** 풀업저항이 센서·LCD 양쪽에 각각 있어 병렬로 겹치지만, 배선이 짧고 장치가 2개뿐이면 실사용에 문제없습니다. 선을 공유하는 것도 편법이 아니라 I2C의 원래 설계 목적이며(주소로 구분), 굳이 분리하려면 소프트웨어 I2C·멀티플렉서 칩도 있지만 이 정도 규모에선 불필요합니다.
        </script>

## I2C 주소 확인하기 — 스캐너 코드 ⚠️

- LCD 백팩의 실제 I2C 주소(0x27 또는 0x3F 등)를 정확히 알아야 다음 파트 코드가 정상 작동합니다.
- 아래 스캐너 코드를 최종 코드보다 먼저 업로드해서 주소를 확인하세요.

```cpp
#include <Wire.h>

void setup() {
  Wire.begin();
  Serial.begin(9600);
  Serial.println("I2C 스캐너 시작");
}

void loop() {
  byte count = 0;
  for (byte address = 1; address < 127; address++) {
    Wire.beginTransmission(address);
    if (Wire.endTransmission() == 0) {
      Serial.print("발견된 장치 주소: 0x");
      Serial.println(address, HEX);
      count++;
    }
  }
  if (count == 0) Serial.println("I2C 장치를 찾을 수 없습니다.");
  delay(3000);
}
```

**사용 방법**: 업로드 후 시리얼 모니터(9600 baud)에서 두 주소 확인(센서 0x29, LCD 0x27/0x3F) → LCD 주소를 슬라이드 33 코드의 `LCD_ADDRESS`에 반영

> 💡 **시니어 과학샘 팁:** "장치가 하나도 안 잡혀요"라면 십중팔구 SDA/SCL 배선 문제입니다. 여기서 미리 잡으면 다음 파트 디버깅이 훨씬 쉬워집니다.

## I2C 통신 복습

- I2C는 SDA(데이터)·SCL(시계) 단 2개의 선으로 여러 장치가 순서를 지켜가며 대화하는 통신 규칙

> 💡 **시니어 과학샘 팁:** "두 장치가 같은 선을 쓰는데 안 헷갈리나요?" — 단체 채팅방에서 이름을 부르고 말하는 것과 같다고 설명하면 이해가 빠릅니다.

## 버튼 입력과 풀업저항 개념

- `pinMode(7, INPUT_PULLUP);` — D7 핀을 "버튼을 안 누르면 HIGH, 누르면 LOW"로 읽도록 설정
- **디바운스(Debounce)**: 기계식 버튼은 눌리는 순간 미세하게 여러 번 떨리며 접촉합니다(수 밀리초). 이를 막기 위해 일정 시간(50ms) 동안의 변화는 무시하는 처리를 합니다.

> 💡 **시니어 과학샘 팁:** 디바운스는 "손이 떨리니까 한 번의 확실한 클릭만 인정해준다"는 개념으로 설명하면 이해가 쉽습니다.

- `lcd.init();` — LCD 초기화(전원 연결 직후 한 번)
- `lcd.backlight();` — 화면 뒷불 켜기

## 실습 코드 전체본 (최종 통합 코드) — 1/2

`LCD_ADDRESS` 값은 슬라이드 26에서 확인한 실제 주소로 반드시 바꾸세요.

```cpp
#include <Wire.h>
#include "Adafruit_TCS34725.h"
#include <LiquidCrystal_I2C.h>

const int BUTTON_PIN = 7;
const int LCD_ADDRESS = 0x27;   // 스캐너로 확인한 주소로 교체!

Adafruit_TCS34725 tcs = Adafruit_TCS34725(TCS34725_INTEGRATIONTIME_154MS, TCS34725_GAIN_4X);
LiquidCrystal_I2C lcd(LCD_ADDRESS, 16, 2);

bool measuring = false;
int lastButtonState = HIGH;
unsigned long lastDebounceTime = 0;
const unsigned long DEBOUNCE_DELAY = 50;

void setup() {
  Serial.begin(9600);
  pinMode(BUTTON_PIN, INPUT_PULLUP);
  lcd.init();
  lcd.backlight();
  lcd.setCursor(0, 0);
  lcd.print("RGB Sensor Ready");

  if (!tcs.begin()) {
    Serial.println("센서를 찾을 수 없습니다.");
    lcd.setCursor(0, 1);
    lcd.print("Sensor Error!");
    while (1);
  }
  Serial.println("R,G,B,Clear");
  delay(1000);
  showStandby();
}
```

      <section data-markdown>
        <script type="text/template">
## 실습 코드 전체본 (최종 통합 코드) — 2/2

```cpp
void loop() {
  int reading = digitalRead(BUTTON_PIN);

  if (reading != lastButtonState) {
    lastDebounceTime = millis();
  }
  if ((millis() - lastDebounceTime) > DEBOUNCE_DELAY) {
    if (reading == LOW && lastButtonState == HIGH) {
      measuring = !measuring;
      if (!measuring) showStandby();
    }
  }
  lastButtonState = reading;

  if (measuring) {
    uint16_t r, g, b, c;
    tcs.getRawData(&r, &g, &b, &c);
    if (c == 0) c = 1;

    uint8_t r8 = (uint8_t)(r * 255 / c);
    uint8_t g8 = (uint8_t)(g * 255 / c);
    uint8_t b8 = (uint8_t)(b * 255 / c);

    Serial.print(r8); Serial.print(",");
    Serial.print(g8); Serial.print(",");
    Serial.print(b8); Serial.print(",");
    Serial.println(c);

    lcd.setCursor(0, 0);
    lcd.print("R:"); lcd.print(r8); lcd.print(" G:"); lcd.print(g8); lcd.print("   ");
    lcd.setCursor(0, 1);
    lcd.print("B:"); lcd.print(b8); lcd.print(" [Measuring] ");
    delay(1000);
  }
}

void showStandby() {
  lcd.setCursor(0, 0); lcd.print("Standby         ");
  lcd.setCursor(0, 1); lcd.print("Press button    ");
}
```

**체크 포인트**
- [ ] `LCD_ADDRESS`를 실제 값으로 바꿨다
- [ ] 코드를 오타 없이 입력했다

> 💡 **시니어 과학샘 팁:** 센서 내장 LED는 항상 켜둡니다. 매 측정마다 LED를 껐다 켜면 재점등 직후 값이 불안정해질 수 있어, 반복측정 재현성을 위해 LED는 계속 켜두고 버튼은 "읽어서 보여줄지"만 제어합니다.

```cpp

- `measuring = !measuring;` — 느낌표(!)는 "반대로 뒤집기"(토글)

## 코드 해설④ — 측정+LCD 출력 로직

| 코드 | 의미 |
|---|---|
| `if (measuring) { ... }` | 측정 모드일 때만 실행(대기 모드에선 센서 안 읽음) |
| `tcs.getRawData(&r,&g,&b,&c);` | R,G,B,Clear 값을 읽어 변수에 저장 |

## 휴대용 전원 연결 — 9V 배터리

평소 측정은 USB 케이블만으로 충분하며 9V 배터리는 필요 없습니다. 발표·시연처럼 노트북 없이 이동할 때만 사용합니다.

1. 9V 배터리에 스냅-DC잭 케이블 연결
2. 슬라이드 스위치가 OFF인지 확인 후 DC잭을 아두이노 배럴잭에 삽입
3. 스위치를 ON으로 밀면 전원이 들어오며 LCD에 "RGB Sensor Ready" → "Standby" 표시

**체크 포인트**
- [ ] 배터리 케이블이 스위치를 통해 연결되어 있다
- [ ] 스위치 ON/OFF로 전원이 켜지고 꺼진다

> 💡 **시니어 과학샘 팁:** LCD가 추가되며 배터리 소모가 USB 전용일 때보다 약간 늘어납니다. 예비 배터리가 준비되어 있으니 장시간 시연 시 여분을 챙기세요.
        </script>

## 실제 측정 절차 개요 (흐름도)

![측정 절차 흐름도](images/measurement_flowchart.png)

> 💡 **시니어 과학샘 팁:** "측정 모드 On → 값 확인 → Off → 시료 교체"를 하나의 리듬으로 반복하면, 시료를 갈아 끼우는 도중 실수로 잘못된 값이 섞여 들어가는 일을 방지할 수 있습니다.

      <section data-markdown>
        <script type="text/template">
## 측정 절차 상세

1. **영점 측정**: 반응시키지 않은 대조군(증류수 키트)을 먼저 삽입해 기준값 확보
2. **조합별 측정**: 중금속 종류(구리·납·알루미늄·크롬)×농도(1/10/100/500ppm) 조합 순서대로 측정
3. **삽입 방법**: 표시해둔 위치·각도·깊이를 항상 지켜서 삽입
4. **버튼 워크플로우**: 시료 삽입 → 측정 모드 On → 값 안정 대기(2~3초) → 기록 → 측정 모드 Off → 시료 교체
5. **3회 반복 원칙**: 같은 조건에서 3회 반복 → 평균값을 대표값으로 사용
6. **키트 형태 구분 기록**: 캡슐형/스틱형을 구분해서 각각 기록

**체크 포인트**
- [ ] 영점(대조군) 값을 가장 먼저 기록했다
- [ ] 모든 조건에서 3회씩 반복 측정했다
- [ ] 매 측정마다 버튼 On/Off를 빠짐없이 수행했다

> 💡 **시니어 과학샘 팁:** 측정 순서를 무작위로 섞기보다는, 정해진 규칙을 그대로 따르는 것이 나중에 데이터를 정리할 때 실수를 줄여줍니다.
        </script>
      </section>

      <section data-markdown>
        <script type="text/template">
## 데이터 기록법 — 시리얼모니터에서 엑셀까지

1. 시리얼 모니터에서 원하는 구간을 드래그해 **Ctrl+C**
2. 엑셀에서 **Ctrl+V** — 쉼표(,)로 구분되어 "텍스트 나누기"를 쓰면 R/G/B/Clear가 자동으로 각 열로 분리됨
3. LCD 화면은 현장에서 즉시 확인·대조용, 최종 기록은 시리얼모니터→엑셀 기준

**기록표 양식**

| 중금속 종류 | 농도(ppm) | 키트 형태 | 회차 | R | G | B | Clear | 비고 |
|---|---|---|---|---|---|---|---|---|
| 대조군 | 0 | 캡슐형 | 1 | | | | | 영점 |
| 구리 | 1 | 캡슐형 | 1~3 | | | | | 평균 계산용 |

> 💡 **시니어 과학샘 팁:** 측정 직후 조건을 바로 적지 않으면 나중에 헷갈리기 쉽습니다. 측정과 기록을 한 세트로 묶어서 진행하세요.
        </script>
      </section>

      <section data-markdown>
        <script type="text/template">
## [예시표 B] 실험 예상 경향표 (가상 예시 데이터)

안토시아닌의 색 변화 원리(중금속 결합 시 붉은 플라빌륨 → 보라-청색 퀴노이드로 변화)에 따른 **가상의 예시 데이터**입니다. 실제 측정값이 아닙니다.

| 중금속 농도 | 예시 R | 예시 G | 예시 B | 해석 |
|---|---|---|---|---|
| 0 ppm(대조군) | 220 | 120 | 110 | 원래의 붉은 안토시아닌 색 |
| 1 ppm | 205 | 115 | 130 | 아주 약한 변화 시작 |
| 10 ppm | 175 | 100 | 160 | 보라 기운 증가 |
| 100 ppm | 130 | 90 | 200 | 청보라 계열로 뚜렷 이동 |
| 500 ppm | 90 | 80 | 230 | 청색 계열로 가장 진하게 |

- 농도↑ → R값↓, B값↑ 경향이 나타나는지 확인 후 MBL 분광광도계 검량선과 방향이 같은지 대조

> ⚠️ **주의:** 이 표는 실험 전 "무엇을 기대할 수 있는지" 감을 잡기 위한 참고용 예시이며, 실제 데이터가 아닙니다.

> 💡 **시니어 과학샘 팁:** 이런 예상 경향표를 미리 만들어두면, 실제 데이터가 나왔을 때 "예상과 같은 방향인가"를 빠르게 판단할 수 있어 실험 설계 자체도 함께 점검할 수 있습니다.
        </script>
      </section>

| 버튼 눌렀는데 반응 없어요 | 디바운스/배선 문제일 수 있음. 슬라이드 41 On/Off 테스트 재실시 |
| 암실 상자가 좁아서 시료 넣기 힘들어요 | 삽입구를 조금 넓히되 거리·각도 기준은 유지 |
| 캡슐형·스틱형 결과가 달라요 | 정상. 형태별로 반사 특성이 다름 |

**막히면 확인할 순서**: 마스터 배선표 → I2C 스캐너 재실행 → 센서 검증표 → 암실 빛샘 재검증 → 지도교사/멘토에게 질문

  <script src="dist/plugin/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      center: false,
      width: 1280,
      height: 960,
      minScale: 0.1,
      maxScale: 2.0,
      margin: 0.03,
      controls: true,
      progress: true,
      slideNumber: 'c/t',
      touch: true,
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
    });

    // 코드블록마다 "복사" 버튼 추가 — 아두이노 IDE로 코드를 바로 옮길 수 있도록
    function addCopyButtons() {
      document.querySelectorAll('.reveal pre').forEach(function (pre) {
        if (pre.querySelector('.copy-btn')) return;
        var codeEl = pre.querySelector('code');
        if (!codeEl) return;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.textContent = '복사';
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var text = codeEl.innerText;
          var onDone = function () {
            btn.textContent = '복사됨!';
            btn.classList.add('copied');
            setTimeout(function () {
              btn.textContent = '복사';
              btn.classList.remove('copied');
            }, 1500);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(onDone).catch(function () {
              fallbackCopy(text, onDone);
            });
          } else {
            fallbackCopy(text, onDone);
          }
        });
        pre.appendChild(btn);
      });
    }

    function fallbackCopy(text, onDone) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onDone(); } catch (e) { /* noop */ }
      document.body.removeChild(ta);
    }

    Reveal.on('ready', addCopyButtons);
  </script>
